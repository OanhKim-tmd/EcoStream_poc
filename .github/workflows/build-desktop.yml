name: Build Desktop Installers (.exe & .dmg)

on:
  workflow_dispatch:
  push:
    branches:
      - web_demo
      - main
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller cryptography
      - name: Build Windows .exe & Portable ZIP
        run: python scripts/build_desktop_app.py
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoStream-Windows-EXE
          path: dist/EcoStream-Windows-Desktop.zip

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller cryptography
      - name: Build macOS .app & .dmg
        run: python scripts/build_desktop_app.py
      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoStream-macOS-DMG
          path: dist/EcoStream-Installer.dmg


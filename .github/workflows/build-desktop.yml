name: Build Desktop Installers (.exe & .dmg)

on:
  workflow_dispatch:
  push:
    branches:
      - web_demo
      - main
    tags:
      - 'v*'

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller cryptography
      - name: Build Windows .exe & Portable ZIP
        run: python scripts/build_desktop_app.py
      - name: Compile Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts/installer_windows.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" scripts/installer_windows.iss
          } else {
            Write-Warning "Inno Setup compiler not found; portable ZIP is ready in dist/"
          }
      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoStream-Windows-Installers
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller cryptography
      - name: Build macOS .app & .dmg
        run: python scripts/build_desktop_app.py
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcoStream-macOS-Installers
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
